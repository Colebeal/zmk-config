# Enable deep sleep (saves battery)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enables ZMK's experimental BLE connection and security tweaks. Implies
# 2M PHY off (helps Intel AX200 PHY negotiation) and allows unauthenticated
# bond overwrite so re-pairing works without manually clearing slots.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Experimental features imply ZMK_BLE_PASSKEY_ENTRY, which makes macOS demand a
# 6-digit passcode typed on the keyboard at pairing. Override it off so pairing
# is just-works again (can't type the code when a half is unpaired anyway).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Report both halves' battery levels to host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

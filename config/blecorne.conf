# Enable deep sleep (saves battery)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable 2M PHY — Intel AX200 controllers have known issues with PHY
# negotiation that cause connect-then-drop on Linux. Forces 1M PHY only.
CONFIG_BT_CTLR_PHY_2M=n

# Report both halves' battery levels to host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
